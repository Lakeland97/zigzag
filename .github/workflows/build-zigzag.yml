# Builds the app on GitHub's macOS runners, for testing a branch without Xcode on the Mac.
# Temporary: this branch is for a build, not a pull request.
name: Build Zigzag Dev

on:
  push:
    branches: [build/save-path-verify]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use a team-free Debug bundle for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.yml")
          text = path.read_text()
          text = text.replace("DEVELOPMENT_TEAM: 432GL3WKY2", 'DEVELOPMENT_TEAM: ""')
          text = text.replace("PRODUCT_BUNDLE_IDENTIFIER: wang.zigao.zigzag.dev",
                              "PRODUCT_BUNDLE_IDENTIFIER: com.github.zigzag.ci.dev")
          path.write_text(text)
          PY

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Zigzag.xcodeproj -scheme Zigzag -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Sign the app ad hoc so it runs on Apple silicon
        run: |
          APP="build/Build/Products/Debug/Zigzag.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Zip the app
        run: ditto -c -k --keepParent "build/Build/Products/Debug/Zigzag.app" "Zigzag-Dev.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Zigzag-Dev
          path: Zigzag-Dev.zip
          if-no-files-found: error

      - name: Run the tests that cover this work
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test -project Zigzag.xcodeproj -scheme Zigzag \
            -destination 'platform=macOS' -derivedDataPath test-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -only-testing:ZigzagTests/SavePathTests \
            -only-testing:ZigzagTests/CommandActionTests \
            -only-testing:ZigzagTests/LocalizationTests \
            -only-testing:ZigzagTests/SidebarMenuTests \
            -only-testing:ZigzagTests/SidebarRowMenuTests \
            -only-testing:ZigzagTests/FavoriteTests \
            -only-testing:ZigzagTests/PinnedSplitTests \
            -only-testing:ZigzagTests/TutorialTests | tee test.log
          # labelsCenterTheirCapitals is upstream's own test and measures a sub-pixel offset, which rounds away on a
          # runner with no Retina display: it stands aside there itself, at the top of the test. `-skip-testing:` with
          # a single test's name is not honoured for this suite, so the test is what knows (see SettingsLayoutTests).

      - name: Check the tests that matter really ran
        # A selector that matches nothing passes silently, so require every selected suite to report a pass;
        # and a red test is a red build.
        run: |
          # A WebKit log line from the test host can land in the middle of a suite's "passed" line, so require
          # each suite to have started and the run as a whole to have passed.
          for s in SavePathTests CommandActionTests LocalizationTests SidebarMenuTests SidebarRowMenuTests FavoriteTests PinnedSplitTests TutorialTests; do
            grep -q "◇ Suite $s started" test.log || { echo "suite did not run: $s"; exit 1; }
          done
          grep -q "Test run with .* tests in 8 suites passed" test.log || { echo "the selected suites did not all pass"; exit 1; }
          if grep -q "✘" test.log; then echo "a test failed"; exit 1; fi
